
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>toted archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brandHome">
      <h1>toted archive</h1>
      <p>기억을 모으는 곳</p>
    </div>
    <button id="uploadOpen" class="primary-btn">+ 앨범 만들기</button>
  </header>

  <main>
    <section id="homeView" class="view">
      <div class="section-heading">
        <h2>나의 앨범</h2>
        <span id="albumCount">0개의 앨범</span>
      </div>
      <div id="albumList" class="album-list"></div>
      <div id="emptyState" class="empty-state">
        <p>아직 앨범이 없어.</p>
        <p>첫 번째 기억을 모아보자.</p>
      </div>
    </section>

    <section id="albumView" class="view hidden">
      <button id="backHome" class="text-btn">← 앨범 목록</button>
      <div class="section-heading">
        <div>
          <h2 id="albumTitle"></h2>
          <p id="albumDescription"></p>
        </div>
        <span id="photoCount"></span>
      </div>
      <div id="photoGrid" class="photo-grid"></div>
    </section>
  </main>

  <div id="uploadModal" class="modal hidden">
    <div class="modal-content">
      <button id="uploadClose" class="close-btn" aria-label="닫기">×</button>
      <h2>새 앨범 만들기</h2>
      <form id="uploadForm">
        <label for="albumName">앨범 이름</label>
        <input id="albumName" name="albumName" type="text" required maxlength="60" placeholder="앨범 이름">

        <label for="albumDesc">설명</label>
        <textarea id="albumDesc" name="albumDesc" maxlength="200" placeholder="앨범에 대한 설명 (선택)"></textarea>

        <label for="photoFiles">사진 선택</label>
        <input id="photoFiles" name="photos" type="file" accept="image/*" multiple required>

        <p class="form-note">사진은 현재 사용 중인 브라우저에 저장돼.</p>
        <button type="submit" class="primary-btn">앨범 저장하기</button>
      </form>
      <p id="uploadStatus" role="status"></p>
    </div>
  </div>

  <div id="viewer" class="viewer hidden">
    <button id="viewerClose" class="viewer-close" aria-label="닫기">×</button>
    <button id="viewerPrev" class="viewer-nav viewer-prev" aria-label="이전 사진">‹</button>
    <img id="viewerImage" alt="선택한 사진">
    <button id="viewerNext" class="viewer-nav viewer-next" aria-label="다음 사진">›</button>
    <div id="viewerCounter" class="viewer-counter"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>

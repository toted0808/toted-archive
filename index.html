<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="toted archive — personal photo archive">
  <title>toted archive</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="toted archive 홈">toted <span>archive</span></a>
    <button id="openUpload" class="upload-trigger" type="button">＋ 업로드</button>
  </header>

  <main id="homeView" class="view">
    <section class="intro">
      <p class="eyebrow">PERSONAL PHOTO ARCHIVE</p>
      <h1>기억을 모으는 곳<span>.</span></h1>
      <p class="subtext">앨범을 열어 사진을 살펴보세요.</p>
    </section>
    <div id="albumList" class="album-list" aria-live="polite">
      <div class="loading">앨범을 불러오는 중…</div>
    </div>
    <p id="homeMessage" class="empty-message hidden">아직 앨범이 없어요.<br>첫 번째 앨범을 만들어 보세요.</p>
  </main>

  <main id="albumView" class="view hidden">
    <button id="backHome" class="back-button" type="button">← 전체 앨범</button>
    <section class="album-heading">
      <div id="albumCover" class="album-cover"></div>
      <p class="eyebrow">PHOTO COLLECTION</p>
      <h1 id="albumTitle"></h1>
      <p id="photoCount" class="subtext"></p>
    </section>
    <div id="photoGrid" class="photo-grid"></div>
  </main>

  <dialog id="uploadDialog" class="dialog">
    <form id="uploadForm" class="upload-form">
      <div class="dialog-head">
        <div><p class="eyebrow">NEW COLLECTION</p><h2>앨범 업로드</h2></div>
        <button id="closeUpload" class="icon-button" type="button" aria-label="닫기">×</button>
      </div>
      <label>업로드 비밀번호<input id="uploadPassword" type="password" autocomplete="current-password" required placeholder="비밀번호"></label>
      <label>앨범 제목<input id="albumName" type="text" maxlength="80" required placeholder="예: 여름의 기록"></label>
      <label>대표 사진<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></label>
      <label>앨범 사진 <span class="hint">최대 20장 · 사진 한 장당 6MB 이하</span><input id="photoFiles" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required></label>
      <p id="uploadStatus" class="status" role="status"></p>
      <button id="submitUpload" class="primary-button" type="submit">앨범 만들기</button>
      <p class="fine-print">업로드한 사진은 공개적으로 열람할 수 있습니다.</p>
    </form>
  </dialog>

  <div id="viewer" class="viewer hidden" aria-label="사진 보기">
    <button id="closeViewer" class="viewer-close" type="button" aria-label="닫기">×</button>
    <div id="viewerStage" class="viewer-stage">
      <img id="viewerImage" alt="확대된 사진" draggable="false">
    </div>
    <div id="viewerCounter" class="viewer-counter"></div>
    <p class="viewer-help">두 손가락으로 확대 · 위로 밀기: 이전 사진 · 아래로 밀기: 다음 사진</p>
  </div>

  <footer>toted archive <span>·</span> a place for photographs</footer>
</body>
</html>
